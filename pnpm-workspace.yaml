packages:
  - .
  - worker
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
minimumReleaseAgeExclude:
  - "@solidjs/signals@2.0.0-rc.18"
  - "@solidjs/web@2.0.0-rc.18"
  - solid-js@2.0.0-rc.18
  - "@solidjs/diagnostics@2.0.0-rc.18"
peerDependencyRules:
  allowedVersions:
    # @stylexjs/unplugin 声明的 peer 依赖还是 unplugin ^2，实测换成 3 生成的样式完全相同。
    "@stylexjs/unplugin>unplugin": "3"
